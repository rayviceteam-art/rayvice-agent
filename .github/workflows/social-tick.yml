name: Social Tick

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_window:
        description: "Sydney publish-window gate bypass (testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      MEDIA_PUBLIC_BASE: ${{ vars.MEDIA_PUBLIC_BASE }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'card' }}
      SOCIAL_PLATFORMS: ${{ vars.SOCIAL_PLATFORMS || 'facebook,instagram,linkedin,reddit' }}
      SOCIAL_DRYRUN: ${{ vars.SOCIAL_DRYRUN || 'true' }}
      SOCIAL_TZ: Australia/Sydney

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run social tick
        run: |
          if [ "${{ inputs.force_window }}" = "true" ]; then
            python3 scripts/run_social.py --tick --force-window
          else
            python3 scripts/run_social.py --tick
          fi

      - name: Commit state back (social.db + media)
        run: |
          git config user.name "rayvice-bot"
          git config user.email "bot@rayvice.com"
          git add -- data/social.db media/ || true
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: social state $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash
            git push
          fi

      - name: Backup snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-db-${{ github.run_id }}
          path: data/social.db
          retention-days: 7
          if-no-files-found: warn
